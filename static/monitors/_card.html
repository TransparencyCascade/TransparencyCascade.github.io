<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  html,body{margin:0;}
  #card{width:1200px;height:630px;background:#EDE9E0;color:#16130E;display:flex;box-sizing:border-box;padding:46px 52px 40px;gap:36px;font-family:Newsreader,Georgia,serif;}
  .left{flex:0 0 520px;display:flex;flex-direction:column;}
  .stamp{font:700 15px/1 'JetBrains Mono',monospace;letter-spacing:.22em;color:#8A1C1C;border:2px solid #8A1C1C;padding:7px 11px;align-self:flex-start;}
  h1{font:700 46px/1.06 'JetBrains Mono',monospace;margin:22px 0 14px;letter-spacing:-.01em;}
  .nums{display:flex;gap:26px;font:500 14px/1.25 'JetBrains Mono',monospace;color:#6B6459;text-transform:uppercase;letter-spacing:.05em;}
  .nums b{display:block;font-size:38px;color:#16130E;}
  .nums div{min-width:96px;}
  .places{font-size:21px;line-height:1.35;margin-top:18px;color:#16130E;}
  .foot{margin-top:auto;font:500 16px 'JetBrains Mono',monospace;color:#6B6459;}
  .foot b{color:#8A1C1C;}
  .right{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .right svg{width:100%;height:auto;max-height:470px;}
  .right path{vector-effect:non-scaling-stroke;}
  .leg{font:500 13px 'JetBrains Mono',monospace;color:#6B6459;display:flex;gap:16px;margin-top:10px;justify-content:center;}
  .leg i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px;}
</style></head><body>
<div id="card"><div class="left">
  <div class="stamp">ELECTION DAY · NOV. 3, 2026</div>
  <h1 id="h"></h1>
  <div class="nums" id="nums"></div>
  <div class="places" id="places"></div>
  <div class="foot" id="foot"></div>
</div><div class="right"><div id="map"></div>
  <div class="leg"><span><i style="background:#8A1C1C"></i>New</span><span><i style="background:#16130E"></i>Also 2022/2024</span><span><i style="background:#C9C1B2"></i>Dropped since 2024</span></div>
</div></div>
<script>
(async function(){
  const ST = new URLSearchParams(location.search).get('state');
  const D = await (await fetch('data.json?v=card')).json();
  const slug = s => s.toLowerCase().replace(/[^a-z]+/g,'-');
  const rows = ST ? D.rows.filter(r=>r.st===ST) : D.rows, dropped = ST ? D.dropped.filter(d=>d.st===ST) : D.dropped;
  const isNew = r => !r.y22 && !r.y24;
  document.getElementById('h').textContent = ST ? `Is DOJ monitoring your county in ${ST}?` : 'Is DOJ monitoring your county?';
  const n=rows.length, nn=rows.filter(isNew).length;
  document.getElementById('nums').innerHTML = `<div><b>${n}</b>place${n===1?'':'s'} listed</div><div><b>${nn}</b>new</div><div><b>${dropped.length}</b>dropped since 2024</div>` + (ST?'':`<div><b>50</b>states</div>`);
  let pl = ST ? rows.map(r=>r.j).join(' · ') : 'The Justice Department says it will "monitor or observe" voting in 126 counties, cities and towns. Find yours.';
  if (ST && pl.length > 150) pl = pl.slice(0,147).replace(/ ·?[^·]*$/,'') + ' …';
  document.getElementById('places').textContent = pl;
  document.getElementById('foot').innerHTML = `<b>transparencycascade.org/monitors${ST?'/'+slug(ST):''}</b> · THE RAMM`;
  const topo = await (await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/counties-albers-10m.json')).json();
  const listed={}; rows.forEach(r=>{ if(r.fips) (listed[r.fips]=listed[r.fips]||[]).push(r); });
  const drop={}; dropped.forEach(d=>{ if(d.fips && !listed[d.fips]) drop[d.fips]=1; });
  let counties = topojson.feature(topo, topo.objects.counties).features;
  const path = d3.geoPath(); let vb='0 0 975 610', st=null;
  if (ST){ const sf=rows[0].fips.slice(0,2); st=topojson.feature(topo, topo.objects.states).features.find(f=>f.id===sf);
    counties=counties.filter(f=>f.id.slice(0,2)===sf); const [[x0,y0],[x1,y1]]=path.bounds(st), p=Math.max(x1-x0,y1-y0)*0.04; vb=`${x0-p} ${y0-p} ${x1-x0+2*p} ${y1-y0+2*p}`; }
  const svg=d3.select('#map').append('svg').attr('viewBox',vb);
  svg.append('g').selectAll('path').data(counties).join('path').attr('d',path).attr('stroke','none')
    .attr('fill', f=>{ const L=listed[f.id]; if(L) return L.some(isNew)?'#8A1C1C':'#16130E'; return drop[f.id]?'#C9C1B2':'#E2DDD2'; });
  if (ST){ svg.append('path').datum(topojson.mesh(topo, topo.objects.counties,(a,b)=>a!==b&&a.id.slice(0,2)===st.id&&b.id.slice(0,2)===st.id)).attr('fill','none').attr('stroke','#EDE9E0').attr('stroke-width',0.7).attr('d',path);
    svg.append('path').datum(st).attr('fill','none').attr('stroke','#6B6459').attr('stroke-width',1.2).attr('d',path); }
  else { svg.append('path').datum(topojson.mesh(topo, topo.objects.states,(a,b)=>a!==b)).attr('fill','none').attr('stroke','#EDE9E0').attr('stroke-width',0.8).attr('d',path);
    svg.append('path').datum(topojson.feature(topo, topo.objects.nation)).attr('fill','none').attr('stroke','#6B6459').attr('stroke-width',0.8).attr('d',path); }
  await document.fonts.ready; document.body.dataset.ready='1';
})();
</script></body></html>
